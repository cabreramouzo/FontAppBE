# fly.toml app configuration file generated for fontapp on 2026-07-29T18:46:31+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fontapp'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_MIGRATE = 'true'
  # Geo-IP para estadística regional de registro (no es secreto: solo un interruptor).
  GEOIP_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  # Una máquina SIEMPRE encendida. Con `stop` + 0 máquinas la primera petición tras un
  # rato ocioso se medía en más de 20 s (y otra de 6 s detrás), no en "un par de
  # segundos": arrancar el contenedor y abrir la conexión a la base. El cliente corta a
  # los 12 s, así que eso le llega al usuario como "Sin conexión con el servidor" — con
  # el servidor perfectamente sano.
  # Ya hay tráfico real, así que el ahorro dejó de compensar. `suspend` en vez de `stop`
  # para las máquinas que sobren: reanudar es casi instantáneo.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Health check: Fly vigila /health y no enruta tráfico a una instancia caída.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  # 1 GB y no 512 MB. Con 512 el proceso se mata solo bajo el tráfico normal del mapa:
  # medido en los logs de Fly, «Out of memory: Killed process (App) anon-rss:408360kB» —
  # 408 de 512— y detrás el bucle de siempre: arranca, sirve unos 40 s, se le agota el
  # pool de conexiones, falla el health check y el kernel la mata a los 60 s. Con las dos
  # máquinas en ese ciclo, Fly no tiene a quién enrutar y `/fonts/in-bounds` devuelve 500;
  # en la web eso se ve como que «falla la carga del GPX», que es justo donde se reportó.
  #
  # **Y tiene que estar AQUÍ, no en un `fly scale memory`.** Ese comando cambia las
  # máquinas en marcha pero no escribe este fichero, así que el siguiente despliegue lo
  # deshace — lo avisa el propio flyctl al ejecutarlo. Ya había estado en 1 GB y se perdió
  # así: hubo diez despliegues en ocho horas, y como `deploy-backend` no filtraba por
  # rutas, hasta un commit que solo tocaba `web/` bajaba la memoria otra vez a 512.
  #
  # **Y de vuelta a 512 MB**, porque 1 GB era el parche y no la cura. Lo que se comía la
  # máquina era `ContributionScore.compute` cargando las 160.738 fuentes en cada barrido;
  # arreglado eso, lo medido en producción es: 48 MB de pico del servidor tras varios
  # barridos, 78 MB con veinte peticiones de mapa concurrentes encima, y 51 MB el barrido
  # entero. 512 MB son seis veces el peor caso medido.
  #
  # Si vuelve a hacer falta subirla, el sitio es este y la pregunta a hacerse antes es qué
  # ha empezado a cargar de más — no cuánta RAM comprar.
  memory = '512mb'
  cpus = 1
  # `memory_mb` es la clave antigua y quedaba duplicando a `memory`. Dos sitios para el
  # mismo número es la forma de que un día digan cosas distintas.
