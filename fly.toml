# fly.toml app configuration file generated for fontapp on 2026-07-29T18:46:31+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fontapp'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_MIGRATE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
