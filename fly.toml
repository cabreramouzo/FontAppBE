# fly.toml app configuration file generated for fontapp on 2026-07-29T18:46:31+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fontapp'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_MIGRATE = 'true'
  # Geo-IP para estadística regional de registro (no es secreto: solo un interruptor).
  GEOIP_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  # Una máquina SIEMPRE encendida. Con `stop` + 0 máquinas la primera petición tras un
  # rato ocioso se medía en más de 20 s (y otra de 6 s detrás), no en "un par de
  # segundos": arrancar el contenedor y abrir la conexión a la base. El cliente corta a
  # los 12 s, así que eso le llega al usuario como "Sin conexión con el servidor" — con
  # el servidor perfectamente sano.
  # Ya hay tráfico real, así que el ahorro dejó de compensar. `suspend` en vez de `stop`
  # para las máquinas que sobren: reanudar es casi instantáneo.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Health check: Fly vigila /health y no enruta tráfico a una instancia caída.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
