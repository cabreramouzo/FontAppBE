<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: la gota de FontApp (icon.svg), no el logo de Vapor. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- iOS: comportamiento tipo app al añadir a pantalla de inicio -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FontApp · fonts d'aigua a prop teu</title>
    <meta name="description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat (aigua, potabilitat, fotos)." />
    <!-- Open Graph (miniatura al compartir el enllaç) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FontApp" />
    <meta property="og:title" content="FontApp · fonts d'aigua a prop teu" />
    <meta property="og:description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat (aigua, potabilitat, fotos)." />
    <meta property="og:url" content="https://fontapp.net/" />
    <meta property="og:image" content="https://fontapp.net/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="ca_ES" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FontApp · fonts d'aigua a prop teu" />
    <meta name="twitter:description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat." />
    <meta name="twitter:image" content="https://fontapp.net/icon-512.png" />
    <!-- Aplica el tema guardado antes de pintar, para evitar el parpadeo. -->
    <script>
      (function () {
        try {
          var th = localStorage.getItem('fontapp_theme')
          if (th && th !== 'system') document.documentElement.setAttribute('data-theme', th)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
