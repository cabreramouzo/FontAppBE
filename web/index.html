<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: the FontApp drop (icon.svg), not the Vapor logo. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- iOS: app-like behavior when added to the home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FontApp · fonts d'aigua a prop teu</title>
    <meta name="description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat (aigua, potabilitat, fotos)." />
    <!-- Open Graph (thumbnail when sharing the link) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FontApp" />
    <meta property="og:title" content="FontApp · fonts d'aigua a prop teu" />
    <meta property="og:description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat (aigua, potabilitat, fotos)." />
    <meta property="og:url" content="https://fontapp.net/" />
    <!-- 1200x630: es la proporción que LinkedIn, WhatsApp y Slack pintan a lo ancho.
         Con el icono cuadrado de 512 salía una tarjeta pequeña, casi sin presencia. -->
    <meta property="og:image" content="https://fontapp.net/og-card-ca.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FontApp: mapa col·laboratiu de fonts d'aigua" />
    <meta property="og:locale" content="ca_ES" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="gl_ES" />
    <meta property="og:locale:alternate" content="eu_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FontApp · fonts d'aigua a prop teu" />
    <meta name="twitter:description" content="Troba fonts d'aigua a prop teu i consulta'n l'estat." />
    <meta name="twitter:image" content="https://fontapp.net/og-card-ca.jpg" />
    <!-- Apply the saved theme before first paint, to avoid the flash. -->
    <script>
      (function () {
        try {
          var th = localStorage.getItem('fontapp_theme')
          if (th && th !== 'system') document.documentElement.setAttribute('data-theme', th)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
