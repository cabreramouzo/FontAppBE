name: CI

on:
  push:
  pull_request:

jobs:
  # Qué se ha tocado. Sin esto, el backend se compilaba, se testeaba y se DESPLEGABA en
  # cada push a main aunque el cambio fuera solo de front: `deploy-backend` no miraba más
  # que la rama. Medido en este repo — el commit «fix: recover stale PWA shell cache»,
  # que solo tocaba `web/`, se llevó 22 minutos (11 de `swift test` y 11 de `flyctl
  # deploy`) para desplegar un backend idéntico. Y no es solo tiempo: cada despliegue
  # reinicia el proceso, y con él se van el rate limit (en memoria y por instancia), la
  # caché de `/activity`, las de `/zones` y el pulso, y el temporizador de la gamificación.
  #
  # La regla va por **exclusión y no por inclusión**: se despliega salvo que TODO lo tocado
  # sea de front o documentación. Con una lista de rutas de backend, el día que alguien
  # añada una carpeta nueva y no se acuerde de apuntarla aquí, dejaría de desplegarse sin
  # que nada fallara — un silencio que se descubre tarde. Al revés el fallo es barato: se
  # despliega de más.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta los dos extremos de la comparación, y en un push pueden ser varios
          # commits. Sin historial, `git diff` no tiene contra qué comparar.
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            antes="${{ github.event.pull_request.base.sha }}"
          else
            antes="${{ github.event.before }}"
          fi
          # La regla vive en `scripts/toca-backend.sh` y NO aquí: dentro del YAML no hay
          # forma de probarla, y equivocarse hacia «no despliegues» es un fallo que no se
          # ve — todo en verde y producción vieja. `scripts/toca-backend.test.sh` la
          # comprueba contra los commits reales del repo.
          backend=$(./scripts/toca-backend.sh "$antes" "${{ github.sha }}")
          echo "Toca al backend: $backend"
          git diff --name-only "$antes" "${{ github.sha }}" 2>/dev/null | sed 's/^/  /' || true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  backend:
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapor
          POSTGRES_PASSWORD: vapor
          POSTGRES_DB: fontapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: vapor
      DATABASE_PASSWORD: vapor
      DATABASE_NAME: fontapp_test
    steps:
      - uses: actions/checkout@v4
      # El runner arranca limpio cada vez, así que sin esto se recompila el árbol entero
      # de dependencias en cada ejecución. Medido antes de ponerlo: el paso «Run tests»
      # tardaba 9:24, de los que ~3:30 eran compilar y ~6:00 ejecutar los 181 tests contra
      # Postgres. Lo segundo es el suelo y no se toca; lo primero es lo que ahorra esto.
      #
      # La clave lleva `Package.resolved`: al cambiar una dependencia se compila de nuevo,
      # que es lo correcto. `restore-keys` permite partir de la caché anterior aunque la
      # clave no case exacta, que es el caso normal al subir una versión.
      - name: Caché de compilación
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swift-build-${{ runner.os }}-
      - name: Run tests
        run: swift test

  # El build de la web NO se filtra: son 45 segundos y dentro va `check:i18n`, que es la
  # red que evita un diccionario incompleto. Además `deploy-backend` lo necesita en verde,
  # y saltárselo obligaría a `always()` y a mirar resultados a mano para ahorrar menos de
  # un minuto.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Una sola fuente de verdad con Cloudflare Pages, que también lee ese fichero.
          # Que CI y el despliegue usaran versiones distintas es justamente cómo se coló
          # un build roto con Actions en verde.
          node-version-file: web/.nvmrc
      - run: npm ci
      - run: npm run build

  deploy-backend:
    needs: [cambios, backend, web]   # solo si tests + build pasan
    # Con el backend sin tocar, `backend` queda saltado y esto se salta solo por
    # propagación; la condición explícita está para que se lea aquí por qué no despliega
    # sin tener que deducirlo del grafo de `needs`.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-backend  # evita despliegues solapados
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Un reintento, y solo uno.
      #
      # El builder remoto de Fly falla de vez en cuando **antes de construir nada**, con
      # errores suyos y no nuestros: «timed out connecting to machine», «failed to list
      # workers», «authentication handshake failed: EOF». Pasó el 31/08/2026. Cuando
      # ocurre, la release anterior se queda sirviendo tal cual —comprobado: la app
      # seguía en 200— así que lo único que se pierde es el despliegue, y hasta que
      # alguien mira el rojo de CI y lo relanza a mano puede pasar un día.
      #
      # Reintentar un `deploy` es seguro: si la primera pasada llegó a publicar, la
      # segunda no encuentra nada que cambiar; si no llegó, construye. Y un fallo real
      # —Dockerfile roto, health check que no pasa— falla las dos veces y el job sigue
      # saliendo en rojo, que es lo que no se puede perder. Por eso **uno** y no tres:
      # con más, un fallo de verdad tarda una hora en reconocerse.
      - name: Deploy (con un reintento si el builder de Fly falla)
        run: flyctl deploy --remote-only || (echo "Primer intento fallido; reintento" && sleep 30 && flyctl deploy --remote-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
