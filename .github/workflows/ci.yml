name: CI

on:
  push:
  pull_request:

jobs:
  # Qué se ha tocado. Sin esto, el backend se compilaba, se testeaba y se DESPLEGABA en
  # cada push a main aunque el cambio fuera solo de front: `deploy-backend` no miraba más
  # que la rama. Medido en este repo — el commit «fix: recover stale PWA shell cache»,
  # que solo tocaba `web/`, se llevó 22 minutos (11 de `swift test` y 11 de `flyctl
  # deploy`) para desplegar un backend idéntico. Y no es solo tiempo: cada despliegue
  # reinicia el proceso, y con él se van el rate limit (en memoria y por instancia), la
  # caché de `/activity`, las de `/zones` y el pulso, y el temporizador de la gamificación.
  #
  # La regla va por **exclusión y no por inclusión**: se despliega salvo que TODO lo tocado
  # sea de front o documentación. Con una lista de rutas de backend, el día que alguien
  # añada una carpeta nueva y no se acuerde de apuntarla aquí, dejaría de desplegarse sin
  # que nada fallara — un silencio que se descubre tarde. Al revés el fallo es barato: se
  # despliega de más.
  cambios:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Hacen falta los dos extremos de la comparación, y en un push pueden ser varios
          # commits. Sin historial, `git diff` no tiene contra qué comparar.
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            antes="${{ github.event.pull_request.base.sha }}"
          else
            antes="${{ github.event.before }}"
          fi
          # Ante la duda, TODO. Una rama nueva trae `before` a ceros y un force-push puede
          # dejar un sha que ya no existe; en los dos casos no hay comparación posible, y
          # equivocarse hacia «no despliegues» es justo el error que no se ve.
          if [ -z "$antes" ] || [ "$antes" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$antes^{commit}" 2>/dev/null; then
            echo "Sin punto de comparación ($antes): se asume que toca al backend."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ficheros=$(git diff --name-only "$antes" "${{ github.sha }}")
          echo "Ficheros tocados:"; echo "$ficheros" | sed 's/^/  /'
          # `|| true` porque grep sale con 1 cuando no casa nada, y aquí eso es un
          # resultado válido (todo era de front), no un error del paso.
          relevantes=$(printf '%s\n' "$ficheros" | grep -Ev '^(web/|flyer/|docs/)|\.md$' || true)
          if [ -z "$relevantes" ]; then
            echo "Solo front y documentación: no se toca el backend."
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "Toca al backend:"; echo "$relevantes" | sed 's/^/  /'
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapor
          POSTGRES_PASSWORD: vapor
          POSTGRES_DB: fontapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: vapor
      DATABASE_PASSWORD: vapor
      DATABASE_NAME: fontapp_test
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  # El build de la web NO se filtra: son 45 segundos y dentro va `check:i18n`, que es la
  # red que evita un diccionario incompleto. Además `deploy-backend` lo necesita en verde,
  # y saltárselo obligaría a `always()` y a mirar resultados a mano para ahorrar menos de
  # un minuto.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Una sola fuente de verdad con Cloudflare Pages, que también lee ese fichero.
          # Que CI y el despliegue usaran versiones distintas es justamente cómo se coló
          # un build roto con Actions en verde.
          node-version-file: web/.nvmrc
      - run: npm ci
      - run: npm run build

  deploy-backend:
    needs: [cambios, backend, web]   # solo si tests + build pasan
    # Con el backend sin tocar, `backend` queda saltado y esto se salta solo por
    # propagación; la condición explícita está para que se lea aquí por qué no despliega
    # sin tener que deducirlo del grafo de `needs`.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-backend  # evita despliegues solapados
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
