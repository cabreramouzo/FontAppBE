name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapor
          POSTGRES_PASSWORD: vapor
          POSTGRES_DB: fontapp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: vapor
      DATABASE_PASSWORD: vapor
      DATABASE_NAME: fontapp_test
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  deploy-backend:
    needs: [backend, web]        # solo si tests + build pasan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-backend  # evita despliegues solapados
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
